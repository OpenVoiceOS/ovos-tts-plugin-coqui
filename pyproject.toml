[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-tts-plugin-coqui"
dynamic = ["version"]
description = "A tts plugin for OVOS"
license = {text = "Apache-2.0"}
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["mycroft", "ovos", "plugin", "tts"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.0",
    "Programming Language :: Python :: 3.1",
    "Programming Language :: Python :: 3.2",
    "Programming Language :: Python :: 3.3",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
]
dependencies = [
    "coqui-tts",
    "torch",
    "torchaudio",
    "transformers>=5.16,<6",
    "langcodes",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "ovoscope[tts]",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-tts-plugin-coqui"

[project.entry-points."opm.tts"]
"ovos-tts-plugin-coqui" = "ovos_tts_plugin_coqui:CoquiTTSPlugin"
"ovos-tts-plugin-coqui-xtts" = "ovos_tts_plugin_coqui:CoquiXTTSPlugin"
"ovos-tts-plugin-coqui-freevc" = "ovos_tts_plugin_coqui:CoquiFreeVCTTS"
"ovos-tts-plugin-coqui-fairseq" = "ovos_tts_plugin_coqui:CoquiFairSeqTTSPlugin"

[tool.setuptools.dynamic]
version = {attr = "ovos_tts_plugin_coqui.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_tts_plugin_coqui*"]
